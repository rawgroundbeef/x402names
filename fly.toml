# Fly.io deployment configuration for x402names API
# Create volume first: fly volumes create x402names_data --size 1 --region iad

app = "x402names-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = "x402names_data"
  destination = "/app/data"
  initial_size = "1gb"
